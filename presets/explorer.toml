# Explorer: the "full" layout without a fixed store. Users open any GeoZarr store with the store picker (or
# ?store=…&endpoint=… on the URL). The relay is relative ("proxy/", not "/proxy/") so it also works when the page is
# served under a path prefix (e.g. a Renku session). Assemble: python3 scripts/assemble.py presets/explorer.toml -o build/explorer/index.html
title = "GeoZarr explorer"
relay = "proxy/"
theme = "auto"

[layout]
sidebar = "left"
sidebar_width = 320
sidebar_collapsible = true

# "Global settings": one collapsible block pinned to the bottom of the sidebar (expanded by default)
[groups."Global settings"]
collapsed = false
icon = "gear"

[[components]]
name = "store-picker"
slot = "topbar"

[[components]]
name = "info-panel"
slot = "topbar"

[[components]]
name = "variable-cards"
slot = "sidebar"

[[components]]
name = "label-mode"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "dim-roles"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "center-lon"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "basemap"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "cmap-sources"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "style-controls"
options = { placement = "card" }

[[components]]
name = "legend"
slot = "sidebar"
options = { placement = "card" }

[[components]]
name = "var-attrs"

[[components]]
name = "timeline"
slot = "bottom"

[[components]]
name = "dim-sliders"
slot = "overlay-tr"

[[components]]
name = "readout"
slot = "overlay-br"

# Closest to the original preview page: store picker + info panel on top, collapsible left sidebar with variable cards
# (colour controls and legend inside the cards), timeline at the bottom, dimension sliders and readout on the map.
# Assemble: python3 scripts/assemble.py presets/full.toml -o build/full.html
title = "MUR SST demo"
store = "s3://spi-greenfjord-public/test/mur_sst_subset.zarr"
endpoint = "https://os.zhdk.cloud.switch.ch"
relay = "/proxy/"
theme = "auto"

[layout]
sidebar = "left"
sidebar_width = 320
sidebar_collapsible = true

# "Global settings": one collapsible block pinned to the bottom of the sidebar (expanded by default)
[groups."Global settings"]
collapsed = false
icon = "gear"

[[components]]
name = "store-picker"
slot = "topbar"

[[components]]
name = "info-panel"
slot = "topbar"

[[components]]
name = "variable-cards"
slot = "sidebar"

[[components]]
name = "label-mode"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "dim-roles"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "center-lon"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "basemap"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "cmap-sources"
slot = "sidebar-bottom"
group = "Global settings"

[[components]]
name = "style-controls"
options = { placement = "card" }

[[components]]
name = "legend"
slot = "sidebar"
options = { placement = "card" }

[[components]]
name = "var-attrs"

[[components]]
name = "timeline"
slot = "bottom"

[[components]]
name = "dim-sliders"
slot = "overlay-tr"

[[components]]
name = "readout"
slot = "overlay-br"
